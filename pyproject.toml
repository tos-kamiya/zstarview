[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zstarview"
dynamic = ["version"]
description = "Transparent desktop sky viewer with stars, planets, eclipses, and optional real-time satellite cloud overlay."
readme = { file = "README_pypi.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
keywords = ["astronomy", "planetarium", "sky", "desktop", "pyside6", "satellite", "clouds"]
authors = [
  { name = "Toshihiro Kamiya", email = "kamiya@mbj.nifty.com" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "appdirs>=1.4.4",
  "PySide6>=6.10,<7",
  "astropy>=6.1,<7; python_version < '3.11'",
  "astropy>=7,<8; python_version >= '3.11'",
  "skyfield>=1.54,<2",
  "numpy>=2.2,<2.4",
  "Pillow>=12,<13",
  "polars>=1.38,<2",
  "boto3>=1.42,<2",
  "botocore>=1.42,<2",
  "xarray>=2025.6,<2026.0; python_version < '3.11'",
  "xarray>=2026.0,<2027.0; python_version >= '3.11'",
  "h5netcdf>=1.8,<2",
  "h5py>=3.15,<4",
  "pyproj>=3.7,<4",
  "satpy>=0.59,<0.60; python_version < '3.11'",
  "satpy>=0.60,<0.61; python_version >= '3.11'",
  "rasterio>=1.4.4",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pyongc",
  "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/tos-kamiya/zstarview"
Documentation = "https://github.com/tos-kamiya/zstarview#readme"
Issues = "https://github.com/tos-kamiya/zstarview/issues"
Source = "https://github.com/tos-kamiya/zstarview"

[tool.hatch.version]
path = "src/zstarview/__about__.py"

[tool.hatch.metadata]
package-data = { zstarview = ["data/**/*"] }

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/scripts/save_cloud_snapshot.py",
  "/README.md",
  "/README_pypi.md",
  "/README_ja-JP.md",
  "/LICENSE.txt",
  "/pyproject.toml",
  "/uv.lock",
]
exclude = [
  "/src/zstarview/data/Noto_Sans.zip",
  "/src/zstarview/data/cities1000.zip",
  "/src/zstarview/data/stars/hip_main.dat.zip",
]

[tool.hatch.build.targets.wheel]
exclude = [
  "/src/zstarview/data/Noto_Sans.zip",
  "/src/zstarview/data/cities1000.zip",
  "/src/zstarview/data/stars/hip_main.dat.zip",
]

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/zstarview}"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disable_error_code = ["import-untyped", "attr-defined", "call-overload"]
exclude = [
  "^src/zstarview/data/",
]

[[tool.mypy.overrides]]
module = [
  "zstarview.ui.*",
  "zstarview.render.*",
]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = [
  "zstarview.render.draw",
  "zstarview.ui.window",
  "zstarview.ui.sky_worker",
]
ignore_errors = true

[tool.coverage.run]
source_pkgs = ["zstarview", "tests"]
branch = true
parallel = true
omit = [
  "src/zstarview/__about__.py",
]

[tool.coverage.paths]
zstarview = ["src/zstarview", "*/zstarview/src/zstarview"]
tests = ["tests", "*/zstarview/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[project.gui-scripts]
zstarview = "zstarview:main"

[project.scripts]
zstarview-make-desktop-file = "zstarview:make_desktop_file_main"
zstarview-import-overture-buildings = "zstarview.data.import_overture_buildings:main"
