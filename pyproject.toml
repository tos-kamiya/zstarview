[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zstarview"
dynamic = ["version"]
description = "Transparent desktop sky viewer with stars, planets, eclipses, and optional real-time satellite cloud overlay."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
keywords = ["astronomy", "planetarium", "sky", "desktop", "pyside6", "satellite", "clouds"]
authors = [
  { name = "Toshihiro Kamiya", email = "kamiya@mbj.nifty.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "appdirs",
  "PySide6",
  "astropy",
  "skyfield",
  "numpy",
  "Pillow>=10",
  "polars",

  "boto3",
  "botocore",
  "xarray",
  "h5netcdf",
  "h5py",
  "pyproj",
  "satpy",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[project.urls]
Documentation = "https://github.com/tos-kamiya/zstarview#readme"
Issues = "https://github.com/tos-kamiya/zstarview/issues"
Source = "https://github.com/tos-kamiya/zstarview"

[tool.hatch.version]
path = "src/zstarview/__about__.py"

[tool.hatch.metadata]
package-data = { zstarview = ["data/**/*"] }

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/scripts/save_cloud_snapshot.py",
  "/README.md",
  "/README_ja-JP.md",
  "/LICENSE.txt",
  "/pyproject.toml",
  "/uv.lock",
]
exclude = [
  "/src/zstarview/data/Noto_Sans.zip",
  "/src/zstarview/data/cities1000.zip",
  "/src/zstarview/data/stars/hip_main.dat.zip",
]

[tool.hatch.build.targets.wheel]
exclude = [
  "/src/zstarview/data/Noto_Sans.zip",
  "/src/zstarview/data/cities1000.zip",
  "/src/zstarview/data/stars/hip_main.dat.zip",
]

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/zstarview tests}"

[tool.coverage.run]
source_pkgs = ["zstarview", "tests"]
branch = true
parallel = true
omit = [
  "src/zstarview/__about__.py",
]

[tool.coverage.paths]
zstarview = ["src/zstarview", "*/zstarview/src/zstarview"]
tests = ["tests", "*/zstarview/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[project.gui-scripts]
zstarview = "zstarview:main"

[project.scripts]
zstarview-make-desktop-file = "zstarview:make_desktop_file_main"
